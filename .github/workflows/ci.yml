name: CI

# P1-5 test + CI baseline (card t_644b7899) + P1-6 lint/format gates (t_58636067).
# Quality gate for every PR into main: install → type-check → lint/format →
# unit tests → Playwright smoke → build. The gate definitions live here; branch
# protection (required status checks) is enforced separately by Shiela — the
# check name to require is `check · lint · unit · smoke · build`.

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard-no-git-objects:
    name: guard · no objects/ or .git in tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject committed git object stores
        run: bash scripts/guard-no-git-objects.sh HEAD

  go:
    # ADR-0002 Phase 1: Go backend gate (globe-server config/security core).
    # Separate job on purpose — the `quality` job name is pinned by branch
    # protection (`check · lint · unit · smoke · build`) and must not change.
    name: go · vet + test ./...
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  quality:
    name: check · lint · unit · smoke · build
    # Full gate only gates main: PRs into main + pushes to main. The guard
    # above runs on every push/PR; this preserves the previous trigger scope.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Lint + format check (ESLint · Prettier)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke test (Playwright, headless)
        run: npm run test:smoke

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Build
        run: npm run build
