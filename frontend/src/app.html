<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!--
			Visor HUD type stack is OFFLINE-FIRST (P3-2): no remote font
			hosts — `app.css` falls back to Segoe UI / system-ui / Roboto
			and Consolas, so there is no privacy ping and no FOUC offline.
		-->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
